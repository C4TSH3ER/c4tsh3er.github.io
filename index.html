<style>

/* Layout: teléfono simulado (izquierda, fijo) + hojas de QR imprimibles por sede (derecha). En celular: pestañas App / QR y PINs. */
:root{
  --orange:#EE7203; --orange-ink:#A84F00; --on-orange:#17140F;
  --ink:#17140F; --muted:#6B6259; --line:#E3DCD3;
  --bg:#F3EFEA; --surface:#FFFFFF; --surface-2:#F8F5F1; --app-bg:#F6F3EF;
  --bezel:#17140F; --qrpaper:#FFFFFF; --qrink:#17140F;
  --ok:#2E8A55; --warn:#D9A100; --bad:#C33A28; --info:#1F6FB2;
  --shadow:0 18px 40px -18px rgba(40,25,10,.35);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --orange:#FF8A1F; --orange-ink:#FFA552; --on-orange:#17140F;
  --ink:#F2ECE5; --muted:#A99F94; --line:#3A332C;
  --bg:#12100E; --surface:#1D1A17; --surface-2:#25211D; --app-bg:#171512;
  --bezel:#000000; --qrpaper:#FFFFFF; --qrink:#17140F;
  --ok:#4CC383; --warn:#F2C230; --bad:#F2725F; --info:#62A8EA;
  --shadow:0 18px 40px -18px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --orange:#FF8A1F; --orange-ink:#FFA552; --on-orange:#17140F;
  --ink:#F2ECE5; --muted:#A99F94; --line:#3A332C;
  --bg:#12100E; --surface:#1D1A17; --surface-2:#25211D; --app-bg:#171512;
  --bezel:#000000; --qrpaper:#FFFFFF; --qrink:#17140F;
  --ok:#4CC383; --warn:#F2C230; --bad:#F2725F; --info:#62A8EA;
  --shadow:0 18px 40px -18px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

.wrap{max-width:1200px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;margin-bottom:18px}
.top h2{font-family:var(--f-display);font-size:30px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.02em}
.top h2 span{color:var(--orange-ink)}
.top p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.proto{font-family:var(--f-mono);font-size:11px;padding:5px 9px;border:1px dashed var(--muted);border-radius:4px;color:var(--muted);white-space:nowrap}

.mtabs{display:none;gap:6px;margin-bottom:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:6px}
.mtabs button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.mtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.grid{display:grid;grid-template-columns:400px minmax(0,1fr);gap:32px;align-items:start}
.pane-app{position:sticky;top:16px}
.pane-sim{min-width:0;display:flex;flex-direction:column;gap:20px}

/* ---------- teléfono ---------- */
.phone{background:var(--bezel);border-radius:42px;padding:12px;box-shadow:var(--shadow)}
.urlbar{display:flex;align-items:center;gap:6px;background:#2A2622;color:#D9D2CA;border-radius:30px 30px 0 0;padding:12px 18px 8px;font-family:var(--f-mono);font-size:10.5px;overflow:hidden}
.urlbar svg{flex:none}
.urlbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urlbar b{color:#FFB066;font-weight:500}
.screen{position:relative;background:var(--app-bg);border-radius:0 0 30px 30px;overflow:hidden;height:min(760px,calc(100vh - 150px));min-height:560px;display:flex;flex-direction:column}
#app{flex:1;overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column}

.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;min-height:54px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.bar h1{flex:1;margin:0;font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;flex:none}
.ic-sp{width:4px}
.sess{border:0;background:var(--ink);color:var(--surface);font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:20px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.body{flex:1;padding:16px;display:flex;flex-direction:column;gap:16px}
.foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px}
.foot .btn{flex:1}

.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
h3.sec{margin:0;font-family:var(--f-display);font-size:17px;text-transform:uppercase;letter-spacing:.04em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:10px;border:1px solid transparent;font-weight:700;font-size:15px;text-align:center}
.btn.pri{background:var(--orange);color:var(--on-orange)}
.btn.dark{background:var(--ink);color:var(--surface)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* placa del cambro */
.plate{position:relative;background:var(--orange);color:var(--on-orange);border-radius:10px;padding:14px 18px 0;overflow:hidden}
.plate .rv{position:absolute;width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,.28)}
.plate .r1{top:8px;left:8px}.plate .r2{top:8px;right:8px}
.pl-k{display:block;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.pl-id{display:block;font-family:var(--f-mono);font-weight:700;font-size:34px;line-height:1.1;letter-spacing:-.01em}
.pl-sub{display:block;font-weight:600;font-size:13.5px;padding-bottom:10px}
.pl-band{margin:0 -18px;background:#17140F;color:#F3EFEA;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;padding:6px 18px;display:flex;justify-content:space-between}
.plate.sm .pl-id{font-size:26px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok::before{background:var(--ok)}.pill.warn::before{background:var(--warn)}.pill.bad::before{background:var(--bad)}.pill.info::before{background:var(--info)}

.choice{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:18px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.choice b{display:block;font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.choice small{display:block;color:var(--muted);font-size:13.5px;margin-top:3px}
.choice .ci{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--orange);color:var(--on-orange)}
.choice.alt .ci{background:var(--ink);color:var(--surface)}
.choice .arr{margin-left:auto;color:var(--muted);flex:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:0}
.dl div{min-width:0}
.dl dt{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.dl dd{margin:2px 0 0;font-weight:600}
.dl .full{grid-column:1/-1}

.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.mt{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.mt:last-child{border-bottom:0}
.mt-foto{padding:0;border:0;border-radius:8px;overflow:hidden;background:#111;aspect-ratio:4/3;width:96px;max-width:100%}
.mt-foto img{width:100%;height:100%;object-fit:contain;display:block}
.mt-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mt-top b{font-size:15px}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tag.Correctivo{color:var(--bad)}
.mt p{margin:4px 0 0;font-size:13.5px}
.mt-emp{font-size:13.5px;font-weight:600;color:var(--orange-ink)}
.mt-reg{font-size:12px;color:var(--muted);margin-top:4px}

.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 14px 22px}
.tl li::before{content:"";position:absolute;left:5px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--orange)}
.tl li::after{content:"";position:absolute;left:9.5px;top:18px;bottom:0;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl b{display:block}

.lock{display:flex;gap:12px;align-items:flex-start}
.lock svg{flex:none;margin-top:2px;color:var(--muted)}
.actions{display:grid;gap:8px}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}

/* formularios */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:13.5px}
.field label i{font-style:normal;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.field textarea{min-height:80px;resize:vertical}
.field input[readonly]{background:var(--surface-2);color:var(--muted)}
.pin{font-family:var(--f-mono);font-size:24px !important;letter-spacing:.5em;text-align:center}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:1em}
.photo-box{border:1px dashed var(--line);border-radius:12px;background:var(--surface-2);padding:10px;display:flex;flex-direction:column;gap:8px}
.photo-box img{width:100%;max-height:220px;object-fit:contain;background:#111;border-radius:8px}
.photo-btns{display:flex;gap:8px;flex-wrap:wrap}
.photo-btns .btn{flex:1;min-height:40px;font-size:13.5px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* listas */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.row .id{font-family:var(--f-mono);font-weight:700;font-size:15px;flex:none}
.row .mid{flex:1;min-width:0}
.row .mid div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{display:flex;flex-direction:column;gap:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted);font-weight:600}
.search{width:100%;min-height:42px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.cov{height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.cov i{display:block;height:100%;background:var(--ok)}
.cov.warn i{background:var(--warn)}
.sede{display:flex;flex-direction:column;gap:8px}
.sede-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sede-top b{font-family:var(--f-display);font-size:18px;text-transform:uppercase}

/* escáner */
.vf{position:relative;height:150px;border-radius:14px;background:#0E0D0C;overflow:hidden;display:grid;place-items:center;color:#CFC7BE;font-size:13px;text-align:center;padding:0 30px}
.vf::before{content:"";position:absolute;inset:22px 70px;background:
 linear-gradient(var(--orange),var(--orange)) left top/22px 3px no-repeat,linear-gradient(var(--orange),var(--orange)) left top/3px 22px no-repeat,
 linear-gradient(var(--orange),var(--orange)) right top/22px 3px no-repeat,linear-gradient(var(--orange),var(--orange)) right top/3px 22px no-repeat,
 linear-gradient(var(--orange),var(--orange)) left bottom/22px 3px no-repeat,linear-gradient(var(--orange),var(--orange)) left bottom/3px 22px no-repeat,
 linear-gradient(var(--orange),var(--orange)) right bottom/22px 3px no-repeat,linear-gradient(var(--orange),var(--orange)) right bottom/3px 22px no-repeat}
.vf .line{position:absolute;left:70px;right:70px;top:24px;height:2px;background:var(--orange);box-shadow:0 0 12px var(--orange);animation:scan 2.2s ease-in-out infinite alternate}
@keyframes scan{to{top:calc(100% - 26px)}}
.vf span{position:relative;z-index:1}
.counter{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.counter .big{font-family:var(--f-display);font-size:46px;line-height:.9;font-variant-numeric:tabular-nums}
.counter .big small{font-size:22px;color:var(--muted)}
.simgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.simgrid button{font-family:var(--f-mono);font-size:12px;padding:7px 0;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.simgrid button.done{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.simgrid button.home{border-color:var(--orange)}
.scanrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.scanrow:last-child{border-bottom:0}
.scanrow .id{font-family:var(--f-mono);font-weight:700}
.scanrow .t{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.scanrow.new{animation:flash 1.2s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--orange) 25%,transparent)}to{background:transparent}}

.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:24px}
.center h2{margin:0;font-family:var(--f-display);font-size:28px;text-transform:uppercase;line-height:1.05;text-wrap:balance}
.center p{margin:0;color:var(--muted);max-width:30ch}
.bigicon{width:84px;height:84px;border-radius:22px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}

#toast{position:absolute;left:14px;right:14px;bottom:84px;z-index:30;padding:12px 14px;border-radius:12px;background:var(--ink);color:var(--surface);font-weight:600;font-size:14px;transform:translateY(20px);opacity:0;pointer-events:none;transition:.25s;display:flex;gap:10px;align-items:center}
#toast.show{opacity:1;transform:none}
#toast.warn{background:var(--warn);color:#17140F}
#toast.bad{background:var(--bad);color:#FFFFFF}
#modal{position:absolute;inset:0;z-index:40;background:rgba(10,8,6,.92);display:flex;flex-direction:column;padding:16px;gap:10px}
#modal img{flex:1;min-height:0;width:100%;object-fit:contain}
#modal .btn{align-self:flex-end;background:#FFFFFF;color:#17140F}
.confirm{border:1px solid var(--bad);border-radius:12px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.confirm div{display:flex;gap:8px}.confirm .btn{flex:1}

/* ---------- panel de simulación ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px;margin-bottom:12px}
.panel-h h3{margin:0;font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.panel-h p{margin:0;color:var(--muted);font-size:13.5px}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.qrc{position:relative;padding:8px 8px 0;border-radius:8px;border:1px solid var(--line);background:var(--qrpaper);color:var(--qrink);display:flex;flex-direction:column;gap:6px;transition:transform .15s,box-shadow .15s;text-align:center}
.qrc:hover{transform:translateY(-2px);box-shadow:0 8px 18px -10px rgba(0,0,0,.4)}
.qrc .qr{aspect-ratio:1;width:100%;display:grid;place-items:center}
.qrc .qr img,.qrc .qr canvas{width:100%;height:auto;max-width:100%}
.qrc .qr-fb{font-family:var(--f-mono);font-size:9px;word-break:break-all;color:#5A524A}
.qrc .lab{margin:0 -8px;background:#17140F;color:#FFFFFF;font-family:var(--f-mono);font-weight:700;font-size:13px;padding:5px 0;border-radius:0 0 7px 7px;display:flex;justify-content:center;gap:6px;align-items:center}
.qrc .lab::before{content:"";width:7px;height:7px;background:#EE7203;border-radius:1px}
.qrc.active{outline:3px solid var(--orange);outline-offset:1px}
.qrc .chk{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#FFFFFF;display:none;place-items:center;font-size:13px;font-weight:700}
.qrc.inv .chk{display:grid}
.sedeblock{display:flex;flex-direction:column;gap:10px}
.sedeblock + .sedeblock{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.sedeh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sedeh b{font-family:var(--f-display);font-size:18px;text-transform:uppercase}
.sedeh span{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.pins{width:100%;border-collapse:collapse;font-size:14px}
.pins td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.pins td:last-child{text-align:right;font-family:var(--f-mono);font-weight:700;font-size:15px;color:var(--orange-ink);font-variant-numeric:tabular-nums}
.pins tr.grp td{border-bottom:0;padding-top:12px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.urlbox{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;word-break:break-all;margin:8px 0}
.urlbox b{color:var(--orange-ink)}
.tests{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.tests .btn{min-height:40px;font-size:13.5px;justify-content:flex-start}


.pill.mute::before{background:var(--muted)}.pill.off::before{background:var(--ink)}
.pill.off{text-decoration:line-through;text-decoration-color:var(--muted)}
.pill.dot{padding:3px;border:0;background:transparent}.pill.dot::before{width:9px;height:9px}
.ev-list{padding:4px 0}
.ev-month{padding:12px 14px 6px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-block:1px solid var(--line)}
.ev-month:first-child{border-top:0;border-radius:12px 12px 0 0;margin-top:-4px}
.ev + .ev{border-top:1px solid var(--line)}
.ev-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:11px 14px}
.ev.open .ev-row{background:var(--surface-2)}
.ev-ic{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.ev-ic.k-mant{background:var(--orange);border-color:var(--orange);color:var(--on-orange)}
.ev-ic.k-ubic{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.ev-ic.k-ingreso{color:var(--ok)}
.ev-ic.k-inv{color:var(--info)}
.ev-mid{flex:1;min-width:0}
.ev-mid b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-mid small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-r{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.ev-d{font-family:var(--f-mono);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.ev-x{padding:4px 14px 14px 62px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.xr{display:flex;justify-content:space-between;gap:12px;font-size:13px;border-bottom:1px dashed var(--line);padding-bottom:5px}
.xr span:first-child{color:var(--muted);flex:none}
.xr span:last-child{text-align:right;font-weight:600;min-width:0}
.xfoto{padding:0;border:0;border-radius:8px;overflow:hidden;background:#111;aspect-ratio:4/3;width:100%;max-width:100%}
.xfoto img{width:100%;height:100%;object-fit:contain;display:block}
.radios{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.radios legend{font-weight:700;font-size:13.5px;margin-bottom:6px;padding:0}
.radio{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.radio input{margin-top:4px;accent-color:var(--orange)}
.radio small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.radio:has(input:checked){border-color:var(--orange)}

.combo{position:relative}
.combo-ic{position:absolute;left:12px;top:15px;color:var(--muted);pointer-events:none}
.combo-in{width:100%;min-height:46px;padding:10px 12px 10px 36px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.combo-in:focus{border-color:var(--orange);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 25%,transparent)}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:15;max-height:270px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px}
.combo-opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px}
.combo-opt:hover{background:var(--surface-2)}
.combo-opt span:first-child{flex:1;min-width:0}
.combo-opt b{display:block;font-weight:600;font-size:14px}
.combo-opt small{display:block;color:var(--muted);font-size:12px}
.combo-opt .cnt{font-family:var(--f-mono);font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--orange);color:var(--on-orange)}
.combo-opt .cnt.zero{background:var(--surface-2);color:var(--muted)}
.combo-n,.combo-empty{font-size:11.5px;color:var(--muted);padding:6px 10px 4px;font-weight:600}

.okbox,.warnbox{display:flex;flex-direction:column;gap:4px;border-radius:12px;padding:12px 14px;border:1px solid}
.okbox{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.warnbox{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--surface))}
@media (max-width:960px){
  .grid{grid-template-columns:1fr}
  .pane-app{position:static}
  .mtabs{display:flex}
  .wrap[data-tab="app"] .pane-sim{display:none}
  .wrap[data-tab="sim"] .pane-app{display:none}
  .phone{background:transparent;padding:0;box-shadow:none;border-radius:0}
  .urlbar{border-radius:14px 14px 0 0}
  .screen{border-radius:0 0 14px 14px;border:1px solid var(--line);border-top:0;height:calc(100vh - 170px);min-height:520px}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){.vf .line{animation:none}.scanrow.new{animation:none}.qrc{transition:none}}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--alt:#FF9445}}
:root[data-theme="dark"]{--alt:#FF9445}

.linkbtn{border:0;background:none;color:var(--orange-ink);font-weight:700;font-size:13px;padding:4px 0}
.lockmini{color:var(--muted);font-size:10px}
.ev-ic.k-cond{color:var(--warn)}.ev-ic.k-nov{color:var(--muted)}
.xfoto{position:relative}
.xfoto .more{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.7);color:#FFFFFF;font-weight:700;font-size:13px;padding:3px 8px;border-radius:12px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gi{position:relative;aspect-ratio:4/3;background:#111;border-radius:6px;overflow:hidden}
.gi img{width:100%;height:100%;object-fit:contain;max-height:none}
.gi button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#FFFFFF;font-weight:700}

.fbox{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.chips.wrap{flex-wrap:wrap}
.chips.tabs{position:sticky;top:0}
.row .pills .pill{font-size:11px;padding:2px 7px}


.row.otro{background:var(--surface-2)}
.row.otro .id{color:var(--muted)}
.undo{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:10px;border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--surface))}
.alact{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.alact .search{min-height:40px}

.credit{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;padding-top:18px;font-size:12px;color:var(--muted)}

.about{display:flex;flex-direction:column;gap:12px}

/* ---- app real ---- */
[hidden]{display:none!important}
*{box-sizing:border-box}
img{max-width:100%}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--f-body);font-size:15px;line-height:1.45}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--app-bg);overflow:visible;padding-bottom:env(safe-area-inset-bottom,0px)}
.bar{top:0;padding-top:max(8px,env(safe-area-inset-top,0px))}
.body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#toast{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto}
#modal{position:fixed}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.18);z-index:60}
.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.reader{border-radius:14px;overflow:hidden;background:#0E0D0C;min-height:220px}
.reader video{width:100%!important;border-radius:14px}
.qrprint{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.qlab{border:1px solid #CCCCCC;padding:8px;text-align:center;background:#FFFFFF;color:#000000;display:flex;flex-direction:column;gap:4px;align-items:center;border-radius:6px}

  .qrprint{grid-template-columns:repeat(4,4.2cm);gap:4mm}

const $ = s => document.querySelector(s);
const app = $('#app');
const pad = n => String(n).padStart(2, '0');
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const fmt = iso => { if (!iso) return '—'; const [y,m,d] = iso.slice(0,10).split('-'); return `${+d} ${MES[+m-1]} ${y}`; };
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const nowHM = s => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}` + (s ? `:${pad(d.getSeconds())}` : ''); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = t => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const corto = n => String(n || '').replace(/^COLEGIO /, '').replace(' (IED)', '');
const dias = iso => Math.round((new Date(today()+'T00:00') - new Date(iso.slice(0,10)+'T00:00')) / 864e5);
function hace(iso) { const d = dias(iso); if (d <= 0) return 'hoy'; if (d === 1) return 'ayer'; if (d < 45) return `hace ${d} días`; const m = Math.round(d/30.4); if (m < 12) return `hace ${m} meses`; const y = Math.floor(m/12), r = m % 12; return `hace ${y} año${y>1?'s':''}${r?` y ${r} mes${r>1?'es':''}`:''}`; }

const S = { c:null, k:null, cam:null, session:null, screen:'cargando', params:{}, hist:[], inv:null, panel:null, ubics:null, emps:null, gal:null };

function setSession(s) { S.session = s; try { s ? localStorage.setItem('cambros_sesion', JSON.stringify(s)) : localStorage.removeItem('cambros_sesion'); } catch (e) {} }

/* ---------- servidor ---------- */
let loadT;
function loading(on) { clearTimeout(loadT); if (on) loadT = setTimeout(() => $('#loading').hidden = false, 250); else $('#loading').hidden = true; }
async function api(action, data = {}, quiet) {
  if (!quiet) loading(true);
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, token: S.session?.token }, data)) });
    const j = await r.json();
    if (!j.ok) {
      if (j.error === 'SESION_VENCIDA') { setSession(null); throw new Error('Tu sesión venció. Inicia sesión de nuevo.'); }
      throw new Error(j.error || 'Algo salió mal.');
    }
    return j;
  } catch (e) {
    if (e instanceof TypeError) throw new Error('No hay conexión con el servidor. Revisa tu internet e inténtalo de nuevo.');
    throw e;
  } finally { if (!quiet) loading(false); }
}
async function loadCambro() { S.cam = await api('cambro', { c: S.c, k: S.k }); return S.cam; }
async function ensureUbics() { if (!S.ubics) S.ubics = await api('ubicaciones'); return S.ubics; }

const SRC = {

  colOnly:{ items: () => (S.ubics?.lista || []).filter(x => x.tipo === 'Colegio').map(x => x.id), name: k => uById(k).nombre, sub: k => uById(k).loc, label: k => uById(k).nombre, all: 'Todos', noun: 'colegios', ph: 'Escribe para buscar tu colegio' },
  gest:   { items: () => S.panel?.gestores || [], name: k => k, sub: () => '', label: k => k, all: 'Todos los gestores', noun: 'gestores', ph: 'Escribe para buscar el gestor' },
  emp:    { items: () => S.emps || [], name: k => k, sub: () => '', label: k => k, all: 'Todas las empresas', noun: 'empresas', ph: 'Escribe para buscar la empresa' }
};
function uById(k) { return (S.ubics?.lista || []).find(x => x.id === k) || { nombre: S.panel?.ubic?.[k]?.n || k, loc: '', tipo: '' }; }
const COUNTS = {
  cambros: k => k === 'ALL' ? (S.panel?.cambros.length || 0) : (S.panel ? S.panel.cambros.filter(c => c.l === k).length : (uById(k).n || 0)),
  gcambros: k => k === 'ALL' ? S.panel.cambros.length : S.panel.cambros.filter(c => c.r === k).length,
  mants: k => { const L = S.params.mlist || []; return k === 'ALL' ? L.length : L.filter(m => m.empresa === k).length; },
  mcol: k => { const L = S.params.mlist || []; return k === 'ALL' ? L.length : L.filter(m => m.l === k).length; }
};
function combo(id, value, { src = 'col', all = false, counts = '' } = {}) {
  const S_ = SRC[src], label = value === 'ALL' ? S_.all : value ? S_.label(value) : '';
  return `<div class="combo" data-combo="${id}" data-src="${src}" data-all="${all}" data-counts="${counts}">
    <svg class="combo-ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="${id}" class="combo-in" type="text" autocomplete="off" role="combobox" aria-expanded="false" placeholder="${S_.ph}" value="${esc(label)}" data-label="${esc(label)}">
    <input type="hidden" id="${id}-val" value="${esc(value || '')}">
    <div class="combo-list" role="listbox" hidden></div></div>`;
}
function comboOptions(box, q) {
  const S_ = SRC[box.dataset.src], all = box.dataset.all === 'true', cnt = COUNTS[box.dataset.counts];
  const toks = norm(q).split(/\s+/).filter(Boolean), items = S_.items();
  const hits = items.filter(k => { const h = norm(S_.name(k) + ' ' + S_.sub(k)); return toks.every(t => h.includes(t)); });
  const badge = k => cnt ? `<span class="cnt ${cnt(k) ? '' : 'zero'}">${cnt(k)}</span>` : '';
  let html = '';
  if (all && !toks.length) html += `<button type="button" class="combo-opt" data-val="ALL"><span><b>${S_.all}</b></span>${badge('ALL')}</button>`;
  html += hits.slice(0, 60).map(k => `<button type="button" class="combo-opt" data-val="${esc(k)}"><span><b>${esc(S_.name(k))}</b>${S_.sub(k) ? `<small>${esc(S_.sub(k))}</small>` : ''}</span>${badge(k)}</button>`).join('');
  html = hits.length ? `<div class="combo-n">${hits.length} de ${items.length} ${S_.noun}</div>` + html : `<div class="combo-empty">Nada coincide con "${esc(q)}"</div>`;
  box.querySelector('.combo-list').innerHTML = html;
}
function comboOpen(box, q) { comboOptions(box, q); box.querySelector('.combo-list').hidden = false; box.querySelector('.combo-in').setAttribute('aria-expanded', 'true'); }
function comboClose(box) { box.querySelector('.combo-list').hidden = true; const i = box.querySelector('.combo-in'); i.setAttribute('aria-expanded', 'false'); i.value = i.dataset.label; }
function comboPick(box, val) {
  const S_ = SRC[box.dataset.src], i = box.querySelector('.combo-in'), label = val === 'ALL' ? S_.all : S_.label(val);
  i.value = label; i.dataset.label = label; box.querySelector(`#${box.dataset.combo}-val`).value = val;
  box.querySelector('.combo-list').hidden = true; i.setAttribute('aria-expanded', 'false');
  const id = box.dataset.combo;
  if (id === 'f-col') { S.params.col = val; refreshList(); }
  if (id === 'f-gest') { S.params.gest = val; refreshList(); }
  if (id === 'f-emp') { S.params = { ...S.params, emp: val }; render(); }

  if (id === 'j-add') { const sel = S.params.sel || []; if (val !== 'ALL' && !sel.includes(val)) sel.push(val); keepForm(['j-nom','j-mot']); S.params = { ...S.params, sel }; render(); restoreForm(); }
}
let _form = {};
function keepForm(ids) { _form = {}; ids.forEach(i => { const e = document.getElementById(i); if (e) _form[i] = e.value; }); }
function restoreForm() { Object.entries(_form).forEach(([i, v]) => { const e = document.getElementById(i); if (e) e.value = v; }); _form = {}; }

/* ---------- íconos ---------- */
const ICON = {
  back:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>',
  arr:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>',
  doc:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h7"/></svg>',
  scan:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></svg>',
  found:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M8 11l2 2 4-4"/></svg>',
  lock:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  qr:'<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4M20 17v3"/></svg>',
  warn:'<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/></svg>',
  check:'<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12l5 5 9-10"/></svg>'
};
const EVICON = {
  mant:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.7 5.3a4 4 0 0 0 5 5L19 11.6l-8 8-3-3 8-8-1.3-1.3a4 4 0 0 1-5-5z"/></svg>',
  ubic:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-4-4M20 16H7l4 4"/></svg>',
  ingreso:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  cond:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>',
  inv:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>',
  nov:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>'
};
const credit = () => `<div class="credit">${LOGO(30)}<span>Diseño y desarrollo: <b>${AUTHOR}</b></span></div>`;

/* ---------- pantallas ---------- */
function plate(c, sm) {
  return `<div class="plate ${sm ? 'sm' : ''}"><span class="rv r1"></span><span class="rv r2"></span>
    <span class="pl-k">Cambro</span><span class="pl-id">${esc(c.codigo)}</span><span class="pl-sub">${esc(c.ubic)}</span>
    <div class="pl-band"><span>HOJA DE VIDA</span><span>${c.ingreso ? 'INGRESÓ ' + fmt(c.ingreso).toUpperCase() : 'SIN FECHA DE INGRESO'}</span></div></div>`;
}
const xrow = (k, v) => v ? `<div class="xr"><span>${esc(k)}</span><span>${esc(v)}</span></div>` : '';
const ACC = { dejar: a => `Dejar en ${a.aparecioNom}`, devolver: a => `Devolver a ${a.llaveNom}`, revisar: () => 'Confirmar: está en su sede' };
const ORD = { dejar: a => `Ordenar: dejar en ${a.aparecioNom}`, devolver: a => `Ordenar: devolver a ${a.llaveNom}`, revisar: () => 'Pedir revisión al gestor' };
const ORDTXT = { dejar: a => `dejarlo en ${a.aparecioNom}`, devolver: a => `devolverlo a ${a.llaveNom}`, revisar: () => 'revisar y confirmar que está en su sede' };
const CONF = { dejar: a => `Confirmar: queda en ${a.aparecioNom}`, devolver: a => `Confirmar: ya está en ${a.llaveNom}`, revisar: () => 'Confirmar: está en su sede' };
function alertBody(a) {
  if (a.tipo === 'Ubicación distinta') return `<div class="small">Registrado en: <b>${esc(a.registrado)}</b></div><div class="small">Apareció en: <b>${esc(a.aparecio)}</b></div><div class="small">${esc(a.det)}</div><div class="small">Último traslado registrado: ${esc(a.ultimoTraslado)}</div><div class="small">Responsable: <b>${esc(a.responsable)}</b> · Gestor del lugar donde apareció: <b>${esc(a.gestorLugar)}</b></div><div class="small"><b>Posible error:</b> lo movieron sin registrar el traslado.</div>`;
  if (a.tipo === 'Faltante') return `<div class="small">Registrado en: <b>${esc(a.registrado)}</b></div><div class="small">${esc(a.det)}</div><div class="small">Responsable: <b>${esc(a.responsable)}</b> · Gestor del colegio: <b>${esc(a.gestorLugar)}</b></div>`;
  return `<div class="small">Este cambro no tiene gestor asignado (modo por cambro).</div>`;
}
function alertActions(a, p) {
  if (!(a.tipo === 'Faltante' || a.tipo === 'Ubicación distinta')) return '';
  const isResp = isGestor() && S.session.nombre === a.responsable, opts = a.tipo === 'Ubicación distinta' ? ['dejar', 'devolver'] : ['revisar'];
  const obs = `<input class="search" id="obs-${p}" placeholder="Observación (opcional)">`;
  const direct = `<span class="eyebrow" style="margin-top:4px">Gestionar yo mismo</span><span class="small muted">Para cuando el gestor no está (vacaciones, incapacidad). Queda resuelta de una vez.</span>${obs}<div class="g2">${opts.map(o => `<button class="btn dark" data-act="al-do" data-p="${p}" data-acc="${o}">${esc(ACC[o](a))}</button>`).join('')}</div>`;
  let h = '';
  if (a.orden) {
    h += `<div class="decided"><b>Orden del administrador</b> (${fmt(a.orden.fecha)}): ${esc(ORDTXT[a.orden.accion](a))}.<br><span class="muted">Pendiente de confirmación de ${esc(a.responsable)}.</span></div>`;
    if (isResp) h += `${obs}<button class="btn dark block" data-act="al-do" data-p="${p}" data-acc="${a.orden.accion}">${esc(CONF[a.orden.accion](a))}</button>`;
    if (isAdmin()) h += `<button class="linkbtn" data-act="al-unorder" data-p="${p}">Retirar la orden</button>` + direct;
  } else {
    if (isResp) h += `${obs}<div class="g2">${opts.map(o => `<button class="btn dark" data-act="al-do" data-p="${p}" data-acc="${o}">${esc(ACC[o](a))}</button>`).join('')}</div>`;
    if (isAdmin()) h += `<span class="eyebrow">Dar la orden al gestor</span><div class="g2">${opts.map(o => `<button class="btn ghost" data-act="al-order" data-p="${p}" data-acc="${o}">${esc(ORD[o](a))}</button>`).join('')}</div><span class="small muted">${esc(a.responsable)} debe confirmar la orden.</span>` + direct;
  }
  return h ? `<div class="alact">${h}</div>` : '';
}

const SCREENS = {
  cargando() { return { title: 'Cambros', hideBack: true, body: `<div class="center"><div class="spin"></div><p>Cargando…</p></div>` }; },
  noqr() { return { title: 'Cambros', hideBack: true, body: `<div class="center"><div class="bigicon">${ICON.qr}</div><h2>Escanea el QR de un cambro</h2><p>Esta app solo se abre desde el código pegado en cada cambro. Usa la cámara de tu celular.</p>${credit()}</div>` }; },
  invalido() { return { title: 'Cambros', hideBack: true, body: `<div class="center"><div class="bigicon" style="color:var(--bad)">${ICON.warn}</div><h2>Este código no es válido</h2><p>El link fue modificado o el QR está dañado. Escanea de nuevo el código pegado en el cambro.</p></div>` }; },
  caido() { const cod = 'CAM-' + String(S.c || '').padStart(5, '0'); return { title: 'Cambros', hideBack: true, body: `<div class="center"><div class="bigicon">${ICON.warn}</div><h2>${esc(cod)}</h2><p>El sistema no responde en este momento. ${esc(S.params.err || '')}</p><button class="btn dark" data-act="reintentar">Intentar de nuevo</button></div>` }; },

  inicio() {
    const c = S.cam;
    return { title: 'Cambros', body: `
      <div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">Escaneaste</span>${plate(c, true)}<div>${condPill(c.cond)}</div></div>
      <span class="eyebrow" style="margin-top:6px">¿Qué quieres hacer?</span>
      <button class="choice" data-act="hoja"><span class="ci">${ICON.doc}</span><span><b>Hoja de vida</b><small>Condición, ubicación e historial de mantenimientos</small></span><span class="arr">${ICON.arr}</span></button>
      <button class="choice alt" data-act="inv-choose"><span class="ci">${ICON.scan}</span><span><b>Toma de inventario</b><small>Para el personal del colegio. Pide PIN.</small></span><span class="arr">${ICON.arr}</span></button>
      ${S.session ? `<p class="small muted" style="margin:0">Sesión activa: ${esc(S.session.nombre)}</p>` : ''}
      ${credit()}` };
  },

  hoja() {
    const c = S.cam, pr = c.privado, pe = c.permisos, f = S.params.ev || 'todos';
    let acc = '';
    if (!S.session) acc = `<div class="card lock">${ICON.lock}<div style="flex:1;display:flex;flex-direction:column;gap:10px"><div><b>¿Vas a registrar algo?</b><div class="small muted">Para mantenimientos, traslados o cambios de condición inicia sesión con tu PIN. Ver la hoja de vida no lo necesita.</div></div><button class="btn dark block" data-act="login">Iniciar sesión</button></div></div>`;
    else {
      const b = [];
      if (pe.deshacer) b.push(`<div class="undo"><span class="small">Último traslado: ${fmt(pe.deshacer.fecha)}.${pe.deshacer.hasta ? ` Puedes deshacerlo hasta el <b>${fmt(pe.deshacer.hasta)}</b>.` : ''}</span><button class="btn ghost sm" data-act="undo">${S.params.undoOk ? 'Toca otra vez para confirmar' : 'Deshacer traslado'}</button></div>`);
      if (pe.mant) b.push(`<button class="btn pri block" data-act="mant-new">Registrar mantenimiento</button>`);
      if (pe.editar) b.push(`<div class="g2"><button class="btn dark" data-act="ubic-new">Cambiar ubicación</button><button class="btn dark" data-act="cond-new">Cambiar condición</button></div>`);
      if (pe.admin) b.push(`<button class="btn ghost block" data-act="verif-new">Cambiar verificación (administrador)</button>`);
      if (pe.panel) b.push(`<button class="btn ghost block" data-act="panel">${pe.admin ? 'Consolidado, alertas y jornadas' : 'Consolidado y jornadas'}</button>`);
      if (isGestor() && !pe.editar) b.unshift(`<div class="note">Este cambro no está a tu cargo. Responsable: ${esc(pr?.responsable || 'sin asignar')}.</div>`);
      acc = b.length ? `<div class="actions">${b.join('')}</div>` : '';
    }
    const evs = c.eventos, priv = !!pr;
    const types = [['todos','Todos'],['mant','Mantenimientos'],['ubic','Ubicación'],['cond','Condición']].concat(priv ? [['inv','Inventario'],['nov','Novedades']] : []);
    const match = (e, k) => k === 'todos' || e.k === k || (k === 'ubic' && e.k === 'ingreso');
    let lm = '', rows = '';
    evs.forEach((e, i) => { if (!match(e, f)) return; const mk = e.fecha.slice(0, 7); if (mk !== lm) { lm = mk; rows += `<div class="ev-month">${MESL[+mk.slice(5) - 1] || ''} ${mk.slice(0, 4)}</div>`; }
      const open = S.params.open === i;
      const tag = e.tag ? `<span class="tag ${e.tag === 'PREV' ? 'Preventivo' : 'Correctivo'}">${e.tag}</span>` : e.cond ? `<span class="pill ${CONDS[e.cond]?.cls} dot"></span>` : e.priv ? '<span class="lockmini">●</span>' : '';
      const fotos = e.fotos && e.fotos.length ? `<button class="xfoto" data-act="foto" data-i="${i}" aria-label="Ver fotos"><img src="${foto(e.fotos[0], 900)}" alt="Foto del mantenimiento" loading="lazy">${e.fotos.length > 1 ? `<span class="more">+${e.fotos.length - 1}</span>` : ''}</button>` : '';
      rows += `<div class="ev ${open ? 'open' : ''}"><button class="ev-row" data-act="ev-open" data-i="${i}" aria-expanded="${open}"><span class="ev-ic k-${e.k}">${EVICON[e.k]}</span><span class="ev-mid"><b>${esc(e.title)}</b><small>${esc(e.sub)}</small></span><span class="ev-r"><span class="ev-d">${+e.fecha.slice(8, 10)} ${MES[+e.fecha.slice(5, 7) - 1]}</span>${tag}</span></button>${open ? `<div class="ev-x">${fotos}${e.det.map(d => xrow(d[0], d[1])).join('')}</div>` : ''}</div>`; });
    const verif = priv ? `<div class="vbox v-${VERS[pr.verif]?.cls}"><div class="vrow"><span class="eyebrow">Verificación</span>${verPill(pr.verif)}</div><span class="small">${esc(pr.verifDet || VERS[pr.verif]?.desc)}</span>${pr.alerta ? alertActions(pr.alerta, c.placa) : ''}</div>` : '';
    const nov = priv ? `<div class="card novc"><div class="vrow"><span class="eyebrow">Novedades · privado</span>${pe.editar ? `<button class="linkbtn" data-act="nov-edit">Editar</button>` : ''}</div><div class="small">${esc(pr.novTexto) || '<span class="muted">Sin novedades</span>'}</div></div>` : '';
    return { title: 'Hoja de vida', body: `
      ${plate(c)}
      <div class="card cbox"><div class="vrow"><span class="eyebrow">Condición</span>${condPill(c.cond)}</div>
        ${c.motivo ? `<div class="small"><b>Motivo:</b> ${esc(c.motivo)}</div>` : ''}
        <span class="small muted">${c.condDesde ? `Desde el ${fmt(c.condDesde)}` : 'Desde el ingreso'}</span></div>
      ${verif}
      <div class="card"><dl class="dl">
        <div class="full"><dt>Ingresó</dt><dd>${c.ingreso ? `${fmt(c.ingreso)} <span class="muted small">· ${hace(c.ingreso)}</span>` : 'Sin fecha de ingreso'}</dd></div>
        <div class="full"><dt>Último mantenimiento</dt><dd>${c.ultMant ? `${fmt(c.ultMant.fecha)} <span class="muted small">· ${hace(c.ultMant.fecha)}</span><div class="small muted">${esc(c.ultMant.empresa)} · ${c.ultMant.tipo}</div>` : 'Sin registro'}</dd></div>
        <div class="full"><dt>Último cambio de ubicación</dt><dd>${c.ultUbic ? `${fmt(c.ultUbic.fecha)} <span class="muted small">· ${hace(c.ultUbic.fecha)}</span><div class="small muted">${esc(c.ultUbic.de)} → ${esc(c.ultUbic.a)}</div>` : 'Sin traslados registrados'}</dd></div>
        <div class="full"><dt>Mantenimientos</dt><dd>${c.nMant} <span class="muted small">· ${c.nPrev} preventivo${c.nPrev === 1 ? '' : 's'} · ${c.nMant - c.nPrev} correctivo${c.nMant - c.nPrev === 1 ? '' : 's'}</span></dd></div>
        ${priv ? `<div class="full"><dt>Responsable</dt><dd>${esc(pr.responsable || 'Sin asignar')} <span class="muted small">· ${pr.modo === 'cambro' ? 'asignado al cambro' : 'por ubicación'}</span></dd></div>` : ''}
      </dl></div>
      ${nov}${acc}
      <div style="display:flex;flex-direction:column;gap:10px"><h3 class="sec">Movimientos</h3>
        <div class="chips">${types.map(([k, l]) => `<button class="chip" data-act="ev-filter" data-f="${k}" aria-pressed="${f === k}">${l} (${evs.filter(e => match(e, k)).length})</button>`).join('')}</div>
        <div class="card ev-list">${rows || '<p class="muted small" style="margin:8px 14px">Sin movimientos de este tipo.</p>'}</div>
        ${priv ? '<span class="small muted">● Solo lo ven el administrador y los gestores.</span>' : ''}
      </div>` };
  },

  login() { return { title: 'Iniciar sesión', body: `<form id="f-login" class="card" style="display:flex;flex-direction:column;gap:14px" novalidate autocomplete="off"><div><b>Ingresa tu PIN</b><div class="small muted">Administrador, gestores y empresas de mantenimiento tienen su propio PIN.</div></div><div class="field"><label for="pin-login">PIN</label><input id="pin-login" class="pin" type="password" inputmode="numeric" maxlength="4"></div><div class="err" id="err-login"></div><button class="btn pri block" type="submit">Entrar</button></form>` }; },

  'mant-new'() {
    const fotos = S.params.fotos || [];
    return { title: 'Mantenimiento', body: `
      <div class="small"><span class="eyebrow">Cambro</span><div style="font-family:var(--f-mono);font-weight:700;font-size:18px">${esc(S.cam.codigo)}</div></div>
      <form id="f-mant" style="display:flex;flex-direction:column;gap:14px" novalidate>
        <div class="field"><label for="m-fecha">Fecha del mantenimiento</label><input id="m-fecha" type="date" max="${today()}" value="${today()}"></div>
        <div class="field"><label for="m-emp">Empresa</label>${isAdmin() ? combo('m-emp', '', { src: 'emp' }) : `<input id="m-emp" value="${esc(S.session.nombre)}" readonly>`}</div>
        <div class="field"><label for="m-tipo">Tipo</label><select id="m-tipo"><option>Preventivo</option><option>Correctivo</option></select></div>
        <div class="field"><label>Fotos <i>(mínimo 1, máximo 5)</i></label><div class="photo-box" id="m-fotos">${fotosEditor(fotos)}</div></div>
        <div class="field"><label for="m-com">Comentario <i>(opcional)</i></label><textarea id="m-com" placeholder="Qué se hizo, repuestos, observaciones"></textarea></div>
        <div class="err" id="err-mant"></div>
        <p class="small muted" style="margin:0">Fecha de registro: ${fmt(today())} (se guarda sola).</p>
        <button class="btn pri block" type="submit">Guardar mantenimiento</button>
      </form>` };
  },
  'ubic-new'() {
    return { title: 'Cambio de ubicación', body: `
      <div class="card"><span class="eyebrow">${esc(S.cam.codigo)} está en</span><div style="font-weight:700;font-size:15px">${esc(S.cam.ubic)}</div></div>
      <form id="f-ubic" style="display:flex;flex-direction:column;gap:14px" novalidate>
        <div class="field"><label for="u-col">Nueva ubicación</label>${combo('u-col', '')}</div>
        <div class="field"><label for="u-mot">Motivo <i>(opcional)</i></label><input id="u-mot" placeholder="Ej.: refuerzo por ampliación de cupos"></div>
        ${S.cam.privado?.modo === 'cambro' ? `<p class="small muted" style="margin:0">El responsable sigue siendo ${esc(S.cam.privado.responsable || 'sin asignar')}: en modo por cambro no cambia con el traslado.</p>` : ''}
        <div class="err" id="err-ubic"></div>
        <button class="btn dark block" type="submit">Guardar traslado</button>
      </form>` };
  },
  'cond-new'() {
    const c = S.cam;
    return { title: 'Cambiar condición', body: `
      <div class="card"><span class="eyebrow">${esc(c.codigo)} está</span><div style="margin-top:4px">${condPill(c.cond)}</div></div>
      <form id="f-cond" style="display:flex;flex-direction:column;gap:14px" novalidate>
        <fieldset class="radios"><legend>Nueva condición</legend>${Object.entries(CONDS).map(([k, v]) => `<label class="radio"><input type="radio" name="cond" value="${k}" ${k === c.cond ? 'checked' : ''}><span>${pill(k, v.cls)}<small>${v.desc}</small></span></label>`).join('')}</fieldset>
        <div class="field"><label for="c-mot">Motivo <i>(obligatorio si no es Operativo)</i></label><textarea id="c-mot" placeholder="Ej.: abombamiento en la pared lateral"></textarea></div>
        <div class="err" id="err-cond"></div>
        <button class="btn dark block" type="submit">Guardar condición</button>
      </form>` };
  },
  'verif-new'() {
    const v = S.cam.privado.verif;
    return { title: 'Cambiar verificación', body: `
      <div class="note">Solo el administrador puede cambiar la verificación a mano. Normalmente la cambia el inventario.</div>
      <div class="card"><span class="eyebrow">${esc(S.cam.codigo)} está</span><div style="margin-top:4px">${verPill(v)}</div></div>
      <form id="f-verif" style="display:flex;flex-direction:column;gap:14px" novalidate>
        <fieldset class="radios"><legend>Nueva verificación</legend>${Object.entries(VERS).map(([k, x]) => `<label class="radio"><input type="radio" name="ver" value="${k}" ${k === v ? 'checked' : ''}><span>${pill(k, x.cls)}<small>${x.desc}</small></span></label>`).join('')}</fieldset>
        <div class="field"><label for="v-obs">Observación <i>(obligatoria)</i></label><textarea id="v-obs"></textarea></div>
        <div class="err" id="err-verif"></div>
        <button class="btn dark block" type="submit">Guardar verificación</button>
      </form>` };
  },
  'nov-edit'() {
    const n = S.cam.privado.nov, adv = S.params.adv ?? !!(n.cust || n.obs || n.prop !== 'Compensar');
    return { title: 'Novedades', body: `
      <div class="note">Solo las ven el administrador y los gestores. Las edita el responsable del cambro y el administrador.</div>
      <form id="f-nov" style="display:flex;flex-direction:column;gap:14px" novalidate>
        <label class="radio"><input type="checkbox" id="n-adv" ${adv ? 'checked' : ''}><span><b>Opciones avanzadas</b><small>Propiedad, custodia y observaciones</small></span></label>

function filtered(skip) {

    L.forEach(c => (groups[key(c)] = groups[key(c)] || []).push(c));
    const open = S.params.openG || {};

      return `<div class="grp ${o ? 'open' : ''}"><button class="grp-h" data-act="g-toggle" data-k="${esc(k)}" aria-expanded="${o}"><span class="chev">${ICON.arr}</span><span class="mid"><b>${esc(lab(k))}</b><div class="small muted">${cs.length} cambro${cs.length > 1 ? 's' : ''}${nr ? ` · ${nr} no operativo${nr > 1 ? 's' : ''}` : ''}</div></span><span class="pills">${nf ? pill(nf + ' faltante' + (nf > 1 ? 's' : ''), 'bad') : ''}${nd ? pill(nd + ' ubic. distinta', 'alt') : ''}</span></button>${o ? `<div class="grp-b">${cs.slice(0, 300).map(rowHTML).join('')}</div>` : ''}</div>`; }).join('') || '<p class="muted small" style="margin:0">Ningún cambro coincide con estos filtros.</p>' };

  return `<button class="btn pri block" data-act="jornada-new">Abrir jornada</button>
    <div class="chips">${['Todas', 'Programada', 'Puntual'].map(k => `<button class="chip" data-act="jt" data-v="${k}" aria-pressed="${f === k}">${{ Todas: 'Todas', Programada: 'Programadas', Puntual: 'Puntuales' }[k]} (${k === 'Todas' ? S.panel.jornadas.length : S.panel.jornadas.filter(j => j.tipo === k).length})</button>`).join('')}</div>
    <div class="list">${L.map(j => `<button class="row" data-act="jornada-det" data-id="${esc(j.id)}"><span class="mid"><div><b>${esc(j.nombre)}</b></div><div class="small muted">${esc(j.id)} · ${esc(j.abiertaPor)} · ${fmt(j.desde)}</div><div class="small">${j.hechas} de ${j.n} colegios${j.estado === 'Cerrada' ? ` · ${j.faltantes} faltantes` : ''}</div></span><span class="pills">${pill(j.estado, j.estado === 'Abierta' ? 'ok' : 'mute')}${pill(j.tipo, j.tipo === 'Programada' ? 'info' : 'mute')}</span></button>`).join('') || '<p class="muted small">No hay jornadas.</p>'}</div>`;
}
function mantList() {
  const L = S.params.mlist; if (!L) { loadMant(); return '<div class="center"><div class="spin"></div></div>'; }
  const emp = S.params.emp || 'ALL', mc = S.params.mcol || 'ALL', ms = L.filter(m => (emp === 'ALL' || m.empresa === emp) && (mc === 'ALL' || m.l === mc));
  S.emps = [...new Set(L.map(m => m.empresa))].sort();
  return `<div class="field"><label for="f-mcol">Ubicación</label>${combo('f-mcol', mc, { all: true, counts: 'mcol' })}</div><div class="field"><label for="f-emp">Empresa</label>${combo('f-emp', emp, { src: 'emp', all: true, counts: 'mants' })}</div><div class="small muted">${ms.length} mantenimiento${ms.length === 1 ? '' : 's'}</div>
    <div class="list">${ms.slice(0, 200).map(m => `<button class="row" data-act="open-cambro" data-p="${m.p}" data-k="${m.k}"><span class="id">${String(m.p).padStart(5, '0')}</span><span class="mid"><div><b>${fmt(m.fecha)}</b> · <span class="tag ${m.tipo}">${m.tipo}</span></div><div class="small muted">${esc(m.empresa)} · ${esc(corto(uName(m.l)))} · ${m.fotos} foto${m.fotos === 1 ? '' : 's'}</div></span>${ICON.arr}</button>`).join('') || '<p class="muted small">Sin mantenimientos.</p>'}</div>`;
}
async function loadMant() { try { const r = await api('mantenimientos'); S.params.mlist = r.lista; render(); } catch (e) { fail(e); } }
function ajustes() {
  const cfg = S.panel.cfg;
  return `<div class="card" style="display:flex;flex-direction:column;gap:10px"><b>Responsable de los cambros</b>
      <label class="radio"><input type="radio" name="modo" value="cambro" ${cfg.modo === 'cambro' ? 'checked' : ''}><span><b>Por cambro</b><small>Cada cambro tiene un gestor fijo. No cambia aunque el cambro se traslade; solo lo cambia el administrador en la hoja.</small></span></label>
      <label class="radio"><input type="radio" name="modo" value="ubicacion" ${cfg.modo === 'ubicacion' ? 'checked' : ''}><span><b>Por ubicación</b><small>Responde el gestor del lugar donde esté el cambro. Cambia solo con cada traslado. (Recomendado)</small></span></label></div>
    <div class="card"><dl class="dl"><div class="full"><dt>Siguiente placa disponible</dt><dd>${esc(code(cfg.siguiente))}</dd></div></dl></div>
    <button class="btn dark block" data-act="qrs">Imprimir QR</button>
    <p class="small muted" style="margin:0">Los demás ajustes (destino del QR, días para deshacer, máximo de fotos) se cambian en la pestaña CONFIG de la hoja de Google.</p>
    <div class="card about"><span class="eyebrow">Acerca de</span><div class="about-r">${LOGO(72)}<div><b class="about-n">${AUTHOR}</b><div class="small muted">Diseño y desarrollo</div></div></div>
      <dl class="dl"><div><dt>Aplicación</dt><dd>Hoja de vida Cambros</dd></div><div><dt>Versión</dt><dd>1.0</dd></div></dl></div>`;
}
async function openPanel(tab) { try { await ensureUbics(); S.panel = await api('panel'); if (S.screen === 'panel') render(); else go('panel', { tab: tab || 'cambros', who: 'all' }); } catch (e) { fail(e); } }
async function refreshPanel() { S.panel = await api('panel'); render(); }

/* ---------- render ---------- */
function render(top) {
  if (S.screen !== 'inv-scan') stopCam();
  const sc = SCREENS[S.screen]();
  const backBtn = (S.hist.length && !sc.hideBack) ? `<button class="ic" data-act="back" aria-label="Volver">${ICON.back}</button>` : '<span class="ic-sp"></span>';
  const sess = S.session && !S.screen.startsWith('inv-') ? `<button class="sess" data-act="logout" title="Cerrar sesión">${esc(S.session.nombre.split(' ')[0])} · Salir</button>` : '';
  app.innerHTML = `<header class="bar">${backBtn}<h1>${sc.title}</h1>${sess}</header><main class="body">${sc.body}</main>${sc.foot ? `<div class="foot">${sc.foot}</div>` : ''}`;
  if (top) window.scrollTo(0, 0);
  if (S.screen === 'inv-scan') startCam();
  if (S.screen === 'qrs' && S.params.qlist) drawQRs();
}
function drawQRs() { document.querySelectorAll('.qimg').forEach(el => { if (el.firstChild) return; try { new QRCode(el, { text: el.dataset.url, width: 256, height: 256, colorDark: '#000000', colorLight: '#FFFFFF', correctLevel: QRCode.CorrectLevel.M }); } catch (e) { el.textContent = el.dataset.url; } }); }

/* ---------- cámara (inventario) ---------- */
let cam = null, lastCode = '', lastAt = 0;
async function startCam() {
  if (cam || !$('#reader') || typeof Html5Qrcode === 'undefined') { if (typeof Html5Qrcode === 'undefined' && $('#reader')) $('#reader').innerHTML = '<div class="note">No cargó el lector de QR. Revisa tu conexión.</div>'; return; }
  cam = new Html5Qrcode('reader');
  try { await cam.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 220, height: 220 } }, onScan, () => {}); }
  catch (e) { $('#reader').innerHTML = '<div class="note">No se pudo abrir la cámara. Dale permiso al navegador para usar la cámara y vuelve a entrar.</div>'; cam = null; }
}
async function stopCam() { if (!cam) return; const c = cam; cam = null; try { await c.stop(); c.clear(); } catch (e) {} }
function onScan(text) {
  const now = Date.now(); if (text === lastCode && now - lastAt < 2500) return; lastCode = text; lastAt = now;
  let c, k; try { const u = new URL(text); c = u.searchParams.get('c'); k = u.searchParams.get('k'); } catch (e) {}
  if (!c || !k) { toast('Ese QR no es de un cambro', 'warn'); return; }
  if (S.inv.items.some(i => String(i.c) === String(c))) { toast(`CAM-${String(c).padStart(5, '0')} ya está en la lista`, 'warn'); return; }
  S.inv.items.push({ c, k, hora: nowHM(true) });
  if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) {}
  $('#scan-n').textContent = S.inv.items.length; $('#scan-list').innerHTML = scanList();
  toast(`CAM-${String(c).padStart(5, '0')} agregado`);
}

/* ---------- eventos ---------- */
document.addEventListener('click', async e => {
  const co = e.target.closest('.combo-opt'); if (co) { comboPick(co.closest('.combo'), co.dataset.val); return; }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, d = t.dataset;
  try {
    switch (a) {
      case 'back': back(); break;
      case 'home': S.inv = null; reset('inicio'); break;
      case 'reintentar': boot(); break;
      case 'hoja': go('hoja'); break;
      case 'login': go('login'); break;
      case 'logout': api('logout', {}, true).catch(() => {}); setSession(null); S.panel = null; await loadCambro(); S.hist = [{ screen: 'inicio', params: {} }]; S.screen = 'hoja'; S.params = {}; render(true); toast('Sesión cerrada'); break;
      case 'ev-filter': S.params = { ...S.params, ev: d.f, open: null }; render(); break;
      case 'ev-open': S.params = { ...S.params, open: S.params.open === +d.i ? null : +d.i }; render(); break;
      case 'foto': { const ev = S.cam.eventos[+d.i]; S.gal = { fotos: ev.fotos, i: 0 }; showGal(); break; }
      case 'foto-prev': S.gal.i = (S.gal.i - 1 + S.gal.fotos.length) % S.gal.fotos.length; showGal(); break;
      case 'foto-next': S.gal.i = (S.gal.i + 1) % S.gal.fotos.length; showGal(); break;
      case 'close-modal': $('#modal').hidden = true; break;
      case 'mant-new': if (isAdmin() && !S.emps) S.emps = (await api('empresas')).lista; go('mant-new', { fotos: [] }); break;
      case 'foto-rm': S.params.fotos.splice(+d.i, 1); $('#m-fotos').innerHTML = fotosEditor(S.params.fotos); break;
      case 'ubic-new': await ensureUbics(); go('ubic-new'); break;
      case 'cond-new': go('cond-new'); break;
      case 'verif-new': go('verif-new'); break;
      case 'nov-edit': go('nov-edit'); break;
      case 'undo': if (!S.params.undoOk) { S.params = { ...S.params, undoOk: true }; render(); break; } await api('deshacer', { c: S.c, k: S.k }); await loadCambro(); S.params = { ...S.params, undoOk: false }; render(); toast('Traslado deshecho'); break;
      case 'panel': await openPanel(); break;
      case 'panel-tab': S.params = { ...S.params, tab: d.tab }; render(true); break;
      case 'flt': S.params[d.k] = S.params[d.k] === d.v ? null : d.v; refreshList(); break;
      case 'flt-clear': S.params = { tab: 'cambros', who: S.params.who, grp: S.params.grp, openG: {} }; render(); break;
      case 'who': S.params = { ...S.params, who: d.v }; render(); break;
      case 'grp': S.params = { ...S.params, grp: d.v, openG: {} }; render(); break;
      case 'g-toggle': { const o = { ...(S.params.openG || {}) }; o[d.k] = !o[d.k]; S.params.openG = o; refreshList(); break; }
      case 'g-all': { const o = {}; if (d.v === '1') { const g = S.params.grp; filtered().forEach(c => o[g === 'col' ? c.l : (c.r || 'Sin responsable')] = true); } S.params.openG = o; refreshList(); break; }
      case 'jt': S.params = { ...S.params, jt: d.v }; render(); break;
      case 'open-cambro': { const k = d.k || S.panel?.tokens?.[d.p]; S.c = d.p; S.k = k; await loadCambro(); go('hoja'); break; }
      case 'al-order': await api('alertaOrden', { p: +d.p, accion: d.acc }); await afterAlert(); toast('Orden enviada'); break;
      case 'al-unorder': await api('alertaRetirar', { p: +d.p }); await afterAlert(); toast('Orden retirada'); break;
      case 'al-do': await api('alertaResolver', { p: +d.p, accion: d.acc, obs: ($('#obs-' + d.p)?.value || '').trim() }); await afterAlert(); toast('Alerta resuelta'); break;
      case 'jornada-new': await ensureUbics(); go('jornada-new', { sel: [] }); break;
      case 'jornada-det': go('jornada-det', { id: d.id }); S.params.det = await api('jornadaDetalle', { id: d.id }); render(); break;
      case 'j-rm': keepForm(['j-nom', 'j-mot']); S.params = { ...S.params, sel: (S.params.sel || []).filter(k => k !== d.k) }; render(); restoreForm(); break;
      case 'j-close': S.params = { ...S.params, confirm: true }; render(); break;
      case 'j-close-no': S.params = { ...S.params, confirm: false }; render(); break;
      case 'j-close-yes': { const r = await api('jornadaCerrar', { id: S.params.id }); S.params = { id: S.params.id, det: await api('jornadaDetalle', { id: S.params.id }) }; S.panel = await api('panel', {}, true); render(true); toast(`Jornada cerrada · ${r.faltantes} faltante${r.faltantes === 1 ? '' : 's'}`); break; }
      case 'qrs': await ensureUbics(); go('qrs', { qcol: 'ALL' }); break;
      case 'q-load': { const v = $('#q-col-val').value || 'ALL'; const r = await api('qrs', { llave: v }); S.params = { ...S.params, qcol: v, qlist: r.lista }; render(); break; }
      case 'q-print': window.print(); break;
      case 'inv-choose': go('inv-choose'); break;
      case 'inv-start': await ensureUbics(); go('inv-start', { mode: d.mode }); break;
      case 'inv-cancel': $('#cancel-box').hidden = false; break;
      case 'inv-cancel-no': $('#cancel-box').hidden = true; break;
      case 'inv-cancel-yes': S.inv = null; toast('Cancelado'); reset('inicio'); break;
      case 'inv-finish':
        if (!S.inv.items.length) { toast('Escanea al menos un cambro', 'warn'); break; }
        if (S.inv.modo === 'encontrado') { await saveToma(); break; }
        await stopCam(); { const r = await api('invFaltan', { inv: S.inv.inv, items: S.inv.items }); S.screen = 'inv-resumen'; S.params = { faltan: r.faltan }; render(true); } break;
      case 'inv-back': S.screen = 'inv-scan'; S.params = {}; render(true); break;
      case 'inv-obs': S.params = { ...S.params, obs: true }; render(true); break;
      case 'inv-save': await saveToma(); break;
    }
  } catch (err) { fail(err); }
});
async function afterAlert() { await refreshPanelQuiet(); if (S.screen === 'hoja') { await loadCambro(); render(); } else render(); }
async function refreshPanelQuiet() { if (S.panel) S.panel = await api('panel', {}, true); }
function showGal() { const g = S.gal; $('#modal-img').src = foto(g.fotos[g.i], 2000); $('#modal-n').textContent = `Foto ${g.i + 1} de ${g.fotos.length}`; document.querySelector('.mnav').hidden = g.fotos.length < 2; $('#modal').hidden = false; }
async function saveToma() {
  await stopCam();
  const r = await api('invGuardar', { inv: S.inv.inv, items: S.inv.items, obs: ($('#i-obs')?.value || '').trim() });
  S.inv = null; S.hist = []; S.screen = 'inv-ok'; S.params = { res: r }; render(true);
}

document.addEventListener('input', e => {
  if (e.target.id === 'q-search') { S.params.q = e.target.value; refreshList(); }
  if (e.target.classList.contains('combo-in')) comboOpen(e.target.closest('.combo'), e.target.value);
});
document.addEventListener('focusin', e => { if (e.target.classList?.contains('combo-in')) { e.target.select(); comboOpen(e.target.closest('.combo'), ''); } });
document.addEventListener('focusout', e => { if (e.target.classList?.contains('combo-in')) { const box = e.target.closest('.combo'); setTimeout(() => { if (!box.contains(document.activeElement)) comboClose(box); }, 150); } });
document.addEventListener('mousedown', e => { const o = e.target.closest('.combo-opt'); if (o) { e.preventDefault(); comboPick(o.closest('.combo'), o.dataset.val); } });
document.addEventListener('keydown', e => { if (!e.target.classList?.contains('combo-in')) return; const box = e.target.closest('.combo');
  if (e.key === 'Enter') { e.preventDefault(); const o = box.querySelector('.combo-opt'); if (o && !box.querySelector('.combo-list').hidden) comboPick(box, o.dataset.val); }
  if (e.key === 'Escape') { comboClose(box); e.target.blur(); } });
document.addEventListener('change', async e => {
  const id = e.target.id;
  try {
    if (id === 'm-file') {
      const f = S.params.fotos, files = [...e.target.files].slice(0, 5 - f.length);
      if (e.target.files.length > files.length) toast('Máximo 5 fotos por mantenimiento', 'warn');
      for (const file of files) { const url = await new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ko; r.readAsDataURL(file); }); f.push({ url, mime: file.type || 'image/jpeg', name: file.name || 'foto.jpg' }); }
      $('#m-fotos').innerHTML = fotosEditor(f); $('#err-mant').textContent = '';
    }
    if (id === 'n-adv') { $('#n-fields').hidden = !e.target.checked; S.params.adv = e.target.checked; }
    if (id === 'j-all') { keepForm(['j-nom', 'j-mot']); S.params = { ...S.params, all: e.target.checked }; render(); restoreForm(); }
    if (id === 'j-sel-g' && e.target.value) { const sel = S.params.sel || []; if (!sel.includes(e.target.value)) sel.push(e.target.value); keepForm(['j-nom', 'j-mot']); S.params = { ...S.params, sel }; render(); restoreForm(); }
    if (e.target.name === 'modo') { await api('setModo', { modo: e.target.value }); await refreshPanel(); toast(e.target.value === 'cambro' ? 'Modo: responsable por cambro' : 'Modo: responsable por ubicación'); }
  } catch (err) { fail(err); }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target.id, btn = e.target.querySelector('button[type="submit"]');
  const err = (id, m) => { const el = $('#' + id); if (el) el.textContent = m; };
  if (btn) btn.disabled = true;
  try {
    if (f === 'f-login') {
      const r = await api('login', { pin: $('#pin-login').value.trim() });
      setSession({ token: r.token, rol: r.usuario.rol, nombre: r.usuario.nombre });
      await loadCambro(); back(); toast('Sesión iniciada · ' + r.usuario.nombre);
    }
    if (f === 'f-mant') {
      const fecha = $('#m-fecha').value, emp = $('#m-emp-val') ? $('#m-emp-val').value : '';
      if (!fecha) return err('err-mant', 'Falta la fecha del mantenimiento.');
      if (fecha > today()) return err('err-mant', 'La fecha no puede ser futura.');
      if (isAdmin() && !emp) return err('err-mant', 'Busca y escoge la empresa.');
      if (!S.params.fotos.length) return err('err-mant', 'Falta al menos una foto.');
      const ids = [];
      for (let i = 0; i < S.params.fotos.length; i++) {
        const ft = S.params.fotos[i]; toast(`Subiendo foto ${i + 1} de ${S.params.fotos.length}…`);
        const r = await api('subirFoto', { c: S.c, k: S.k, data: ft.url.split(',')[1], mime: ft.mime, nombre: ft.name });
        ids.push(r.id);
      }
      await api('mantenimiento', { c: S.c, k: S.k, fecha, tipo: $('#m-tipo').value, empresa: emp, comentario: $('#m-com').value.trim(), fotos: ids });
      await loadCambro(); back(); S.params = { ...S.params, ev: 'todos', open: null }; render(true); toast('Mantenimiento guardado');
    }
    if (f === 'f-ubic') {
      const a = $('#u-col-val').value; if (!a) return err('err-ubic', 'Busca y escoge la nueva ubicación.');
      await api('traslado', { c: S.c, k: S.k, destino: a, motivo: $('#u-mot').value.trim() });
      await loadCambro(); back(); S.params = { ...S.params, ev: 'todos', open: null }; render(true); toast('Traslado guardado');
    }
    if (f === 'f-cond') {
      const a = (document.querySelector('input[name="cond"]:checked') || {}).value, mot = $('#c-mot').value.trim();
      if (a === S.cam.cond) return err('err-cond', 'Escoge una condición diferente a la actual.');
      if (a !== 'Operativo' && !mot) return err('err-cond', 'Escribe el motivo.');
      await api('condicion', { c: S.c, k: S.k, cond: a, motivo: mot }); await loadCambro(); back(); toast('Condición actualizada');
    }
    if (f === 'f-verif') {
      const a = (document.querySelector('input[name="ver"]:checked') || {}).value, obs = $('#v-obs').value.trim();
      if (!obs) return err('err-verif', 'La observación es obligatoria.');
      await api('verificacion', { c: S.c, k: S.k, ver: a, obs }); await loadCambro(); back(); toast('Verificación actualizada');
    }
    if (f === 'f-nov') { await api('novedades', { c: S.c, k: S.k, prop: $('#n-prop').value, cust: $('#n-cust').value, obs: $('#n-obs').value }); await loadCambro(); back(); toast('Novedades guardadas'); }
    if (f === 'f-jor') {
      const nom = $('#j-nom').value.trim(), mot = $('#j-mot').value.trim();
      if (!nom) return err('err-jor', 'Ponle un nombre a la jornada.'); if (!mot) return err('err-jor', 'El motivo es obligatorio.');
      if (!S.params.all && !(S.params.sel || []).length) return err('err-jor', 'Agrega al menos un colegio.');
      const r = await api('jornadaAbrir', { nombre: nom, motivo: mot, todos: !!S.params.all, llaves: S.params.sel || [] });
      S.panel = await api('panel', {}, true); S.hist.pop(); S.screen = 'jornada-det'; S.params = { id: r.id, det: await api('jornadaDetalle', { id: r.id }) }; render(true); toast(`Jornada ${r.id} abierta`);
    }
    if (f === 'f-inv') {
      const k = $('#i-col-val').value, nom = $('#i-nom').value.trim(), pin = $('#i-pin').value.trim();
      if (!k) return err('err-inv', 'Busca y escoge tu colegio.'); if (nom.length < 3) return err('err-inv', 'Escribe tu nombre.');
      const r = await api('invInicio', { c: S.c, k: S.k, modo: S.params.mode, llave: k, nombre: nom, pin });
      S.inv = { inv: r.inv, ubic: r.ubic, inicio: r.inicio, modo: S.params.mode, items: [{ c: S.c, k: S.k, hora: nowHM(true) }] };
      S.hist = []; S.screen = 'inv-scan'; S.params = {}; render(true);
    }
  } catch (x) {
    const box = e.target.querySelector('.err'); if (box) box.textContent = x.message; else fail(x);
  } finally { if (btn) btn.disabled = false; }
});
window.addEventListener('beforeunload', e => { if (S.inv && S.inv.items.length > 1) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- arranque (también hace de puente del QR) ---------- */
async function boot() {
  const q = new URLSearchParams(location.search); S.c = q.get('c'); S.k = q.get('k');
  if (!S.c) return reset('noqr');
  S.screen = 'cargando'; render();
  try {
    const r = await api('cambro', { c: S.c, k: S.k });
    if (r.redirigir) { location.replace(r.redirigir); return; }
    S.cam = r; reset('inicio');
  } catch (e) {
    if (e.message === 'QR_INVALIDO') return reset('invalido');
    if (/sesión venció/.test(e.message)) return boot();
    S.hist = []; S.screen = 'caido'; S.params = { err: e.message.indexOf('No hay conexión') === 0 ? '' : e.message }; render();
  }
}
if (API_URL.indexOf('__') === 0 || API_URL.indexOf('PEGA') === 0) { app.innerHTML = '<main class="body"><div class="note">Falta pegar el link de Apps Script en la línea API_URL de este archivo.</div></main>'; }
else boot();

</script>
